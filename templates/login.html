{% extends "base.html" %}
{% block title %}Login — Investify{% endblock %}
{% block content %}
<section class="auth-shell">
  <article class="card auth-card">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>Login to Investify</h1>
    <p class="sub">Save your portfolio, watchlist and settings across devices.</p>

    <div id="auth-error" class="error hidden"></div>
    <div id="auth-status" class="small-muted"></div>

    <button id="google-login" class="google-button" type="button">
      <span>G</span> Continue with Google
    </button>

    <div class="auth-divider"><span>or</span></div>

    <form id="login-form" class="auth-form">
      <label>Email
        <input id="login-email" type="email" autocomplete="email" required>
      </label>
      <label>Password
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button id="login-submit" class="primary-wide" type="submit">Login</button>
    </form>

    <p class="auth-switch">New to Investify? <a href="/signup">Create an account</a></p>
  </article>
</section>
{% endblock %}
{% block scripts %}
<script>
window.INVESTIFY_SUPABASE = {{ supabase_public|tojson }};
window.INVESTIFY_AUTH_PAGE = "login";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="{{ url_for('static', filename='js/auth_pages.js') }}"></script>
{% endblock %}
