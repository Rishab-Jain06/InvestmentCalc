<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Investify{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><span class="brand-mark">I</span><span>Investify</span></a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/markets">Markets</a>
      <a href="/research">Stock Research</a>
      <a href="/news">News</a>
      <a href="/screener">Screener</a>
      <a href="/watchlist">Watchlist</a>
      <a href="/options">Options Lab</a>
      <a href="/search">AI Search <span class="beta-nav">Beta</span></a>
      <a href="/settings">Settings</a>
    </nav>
  </div>
</header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer">Personal research tool · Market data may be delayed · Not investment advice</footer>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script>
  (function active_nav(){
    const path = window.location.pathname;
    document.querySelectorAll(".nav-links a").forEach(a => {
      const href = a.getAttribute("href");
      if (href === "/" ? path === "/" : path.startsWith(href)) {
        a.classList.add("active");
      }
    });
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
