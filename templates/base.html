<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Investify Analytics{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}?v=3" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}?v=3">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/favicon.png') }}?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">

    <a class="brand" href="/" aria-label="Investify Analytics home">
      <img class="brand-logo brand-logo-dark" src="{{ url_for('static', filename='img/logo-dark.png') }}" alt="Investify Analytics">
      <img class="brand-logo brand-logo-light" src="{{ url_for('static', filename='img/logo-light.png') }}" alt="Investify Analytics">
    </a>

    <form id="global-ticker-search" class="global-ticker-search" role="search">
      <input id="global-ticker-input" type="search" placeholder="Search company" autocomplete="off">
    </form>

    <div class="header-actions">
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/markets">Markets</a>
        <a href="/portfolio">Portfolio</a>
        <a href="/research">Research</a>
        <a href="/news">News</a>
        <a href="/calendar">Calendar</a>
        <a href="/screener">Screener</a>
        <a href="/options">Options</a>
        <a href="/search">AI Search</a>
      </nav>

      <button id="theme-toggle" class="theme-toggle nav-theme-toggle" type="button" aria-label="Switch theme">
        <span id="theme-toggle-icon">moon</span>
      </button>

      <button id="mobile-menu-toggle" class="mobile-menu-toggle" type="button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

  </div>
</header>

<div id="mobile-menu-backdrop" class="mobile-menu-backdrop" hidden></div>
<aside id="mobile-menu" class="mobile-menu" aria-label="Mobile navigation" aria-hidden="true">
  <div class="mobile-menu-head">
    <span>Menu</span>
    <button id="mobile-menu-close" class="mobile-menu-close" type="button" aria-label="Close menu">×</button>
  </div>
  <form id="mobile-ticker-search" class="mobile-ticker-search" role="search">
    <input id="mobile-ticker-input" type="search" placeholder="Search company" autocomplete="off">
    <button type="submit">Open</button>
  </form>
  <nav class="mobile-menu-links">
    <a href="/">Home</a>
    <a href="/markets">Markets</a>
    <a href="/portfolio">Portfolio</a>
    <a href="/research">Research</a>
    <a href="/news">News</a>
    <a href="/calendar">Calendar</a>
    <a href="/screener">Screener</a>
    <a href="/options">Options</a>
    <a href="/search">AI Search</a>
  </nav>
</aside>

<main class="container" id="main-content">{% block content %}{% endblock %}</main>
<footer class="footer">Personal research tool · Market data may be delayed · Not investment advice</footer>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script src="{{ url_for('static', filename='js/mobile_nav.js') }}"></script>
<script>
  (function active_nav(){
    const path = window.location.pathname === "/watchlist" ? "/portfolio" : window.location.pathname;
    document.querySelectorAll(".nav-links a, .mobile-menu-links a").forEach(a => {
      const href = a.getAttribute("href");
      if (href === "/" ? path === "/" : path.startsWith(href)) {
        a.classList.add("active");
      }
    });
  })();
</script>
<script src="{{ url_for('static', filename='js/symbol_lookup.js') }}"></script>
<script src="{{ url_for('static', filename='js/global_search.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
