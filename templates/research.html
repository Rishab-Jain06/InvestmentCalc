{% extends "base.html" %}
{% block title %}Stock Research — Investify{% endblock %}
{% block content %}
<section class="page-head narrow"><p class="eyebrow">STOCK RESEARCH</p><h1>Open a research page</h1><p class="sub">Enter a company name or ticker.</p></section>

</form>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/home.js') }}"></script>{% endblock %}
